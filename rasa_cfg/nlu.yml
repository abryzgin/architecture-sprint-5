      - Расскажи про мониторинг
      - Как настроить мониторинг системы
      - Хочу узнать про мониторинг

  - intent: create_ai_ml_chatbot
    examples: |
      - Как создать AI чат-бота
      - Расскажи про создание AI/ML чат-бота
      - Хочу сделать чат-бота на базе ИИ
      - Как сделать ML чат-бота

  - intent: goodbye
    examples: |
      - До свидания
      - Пока
      - Увидимся
      - До связи
      - Всего доброго
      - Прощай
