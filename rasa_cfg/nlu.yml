  - intent: cicd_pipeline
    examples: |
      - Что такое CI/CD
      - Как построить пайплайн CI/CD
      - Расскажи про пайплайн CI/CD
      - Как настроить CI/CD

  - intent: caching
    examples: |
      - Что такое кеширование
      - Расскажи о кешировании
      - Зачем использовать кеш
      - Как работает кеширование

  - intent: monitoring
    examples: |
