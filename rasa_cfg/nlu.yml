version: "3.1"

nlu:
  - intent: greet
    examples: |
      - Привет
      - привет
      - Здравствуйте
      - Добрый день
      - Есть кто
      - Приветствую
      - Хай
      - Ку
      - Тут
      - Привет всем
      - Доброго времени суток
      - Привет-привет

  - intent: help
    examples: |
      - Мне нужна помощь
      - Можете помочь?
      - Помогите мне
      - Подскажите, пожалуйста
      - Я не знаю, что делать
      - У меня есть вопрос

  - intent: about_bot
    examples: |
      - Что ты можешь
      - Что ты умеешь
      - Какие у тебя возможности
      - Расскажи о своих возможностях
      - Что ты умеешь делать

  - intent: architecture_sw
    examples: |
