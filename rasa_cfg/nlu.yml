      - Расскажи про микросервисы
      - Расскажи о микросервисах
      - Хочу узнать про микросервисную архитектуру

  - intent: monolith
    examples: |
      - Что такое монолит
      - Расскажи про монолит
      - Расскажи о монолите
      - Хочу узнать про монолитную архитектуру

  - intent: documentation
    examples: |
