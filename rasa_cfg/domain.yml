version: "3.1"

intents:
  - greet
  - help
  - architecture_sw
  - microservices
  - monolith
  - documentation
  - goodbye
  - about_bot
  - sharding_replication
  - cicd_pipeline
  - caching
  - monitoring
  - create_ai_ml_chatbot

responses:
  utter_greet:
    - text: "Приветствую вас! Чем могу помочь?"
  
  utter_goodbye:
    - text: "До встречи! Обращайтесь, если возникнут новые вопросы."

  utter_about_bot:
    - text: "Я могу рассказать про различные аспекты архитектуры ПО, а также затронуть тему документирования, микросервисов, монолита, шардирования с репликацией, CI/CD, кеширования, мониторинга и даже создания AI/ML чат-ботов."

  utter_help:
    - text: "Скажите, пожалуйста, в чем именно вам нужна помощь?"

  utter_architecture_sw:
    - text: "Архитектура программного обеспечения — это совокупность решений по структурной организации системы, обеспечивающих ее гибкость и дальнейшее развитие."

  utter_microservices:
    - text: "Микросервисная архитектура предполагает деление приложения на небольшие независимые сервисы, которые могут взаимодействовать через четко определенные интерфейсы."

  utter_monolith:
    - text: "Монолитная архитектура означает, что все функции объединены в один модуль, который разворачивается и масштабируется целиком."

  utter_documentation:
    - text: "Документация архитектуры часто включает UML-диаграммы, схемы, описания потоков данных, а также дополнительную информацию об интеграции и интерфейсах."

  utter_sharding_replication:
    - text: "Шардирование и репликация — это способы масштабирования баз данных за счёт распределения и дублирования данных, повышая производительность и отказоустойчивость."

  utter_cicd_pipeline:
    - text: "CI/CD пайплайн — это набор процессов и инструментов, которые автоматизируют сборку, тестирование и развёртывание, ускоряя и упрощая выпуск новых версий."

  utter_caching:
    - text: "Кеширование — это сохранение часто используемых данных в быстро доступном месте, чтобы уменьшить задержку и нагрузку на систему."

  utter_monitoring:
    - text: "Мониторинг необходим для своевременного обнаружения сбоев и анализа работы системы, что помогает поддерживать стабильность и высокую доступность."

  utter_create_ai_ml_chatbot:
    - text: "Создание AI/ML чат-бота включает использование алгоритмов машинного обучения и технологий обработки естественного языка, позволяя боту понимать контекст и отвечать более гибко."

slots:
  topic:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

session_config:
  session_expiration_time: 120
  carry_over_slots_to_new_session: true
